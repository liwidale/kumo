[package]
name = "kumo-hook"
version = "1.0.1"
edition = "2021"
publish = false

[[bin]]
name = "kumo-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
