appId: app.kumo.desktop
productName: Kumo
copyright: Copyright © 2026 Liwidale
directories:
  output: release
  buildResources: resources/icons
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
publish:
  provider: github
  owner: liwidale
  repo: kumo
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**
extraResources:
  - from: resources/relay
    to: relay
  - from: resources/tray
    to: tray
electronLanguages:
  - en-US
  - en-GB
  - ru
  - de
  - fr
  - es
  - ja
  - zh-CN

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico
  executableName: Kumo
  artifactName: Kumo-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Kumo
  deleteAppDataOnUninstall: false

# Signing uses the "Developer ID Application" identity in the keychain (or CSC_LINK + CSC_KEY_PASSWORD).
# Notarization runs on its own when APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER,
# or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, are set. Without them the build is unsigned.
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  x64ArchFiles: "Contents/Resources/{relay/kumo-hook,app.asar.unpacked/node_modules/@koromix/koffi-darwin-*/**}"
  darkModeSupport: true
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: Kumo brings the terminal tab of a session forward and opens new sessions in Terminal or iTerm.
    NSScreenCaptureUsageDescription: Kumo captures a window only when you ask it to share that window as context.
  artifactName: Kumo-${version}-mac.${ext}
dmg:
  title: Kumo
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications
